<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPTV Discovery · 运维面板</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#131b2e;--line:#26334c;--muted:#91a0b8;--text:#edf3ff;--blue:#6ea8fe;--green:#39c58a;--red:#f06b75;--yellow:#e8b64d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% -20%,#1a3155 0,transparent 48%),var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;padding:22px 22px 100px}
main{max-width:1180px;margin:auto}.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.brand{font-size:22px;font-weight:750;letter-spacing:.2px;margin-right:auto}.muted{color:var(--muted)}.pill{border:1px solid var(--line);background:#17233a;border-radius:999px;padding:5px 11px;color:#c8d8f1}.actions{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{border:1px solid #385078;background:#1a2a46;color:#eaf2ff;padding:9px 13px;border-radius:9px;cursor:pointer;font:inherit;text-decoration:none}button.primary{background:#2866c5;border-color:#397ddd}button:hover,.btn:hover{filter:brightness(1.15)}
.notice{padding:12px 15px;border:1px solid #80672c;background:#342b18;color:#f4d68b;border-radius:12px;margin:14px 0}.notice.ok{border-color:#245d4a;background:#142d29;color:#9be4c4}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0}.card,.section{background:linear-gradient(145deg,#151f34,#11192a);border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0}.metric{font-size:28px;font-weight:750;margin-top:4px;font-variant-numeric:tabular-nums}.section{margin-top:14px}.section h2{font-size:15px;margin:0 0 12px}.tagcloud{display:flex;flex-wrap:wrap;gap:8px}.tag{padding:6px 10px;background:#1b2941;border:1px solid #2c3c59;border-radius:8px}.bars{display:grid;gap:12px}.barrow{display:grid;grid-template-columns:95px 1fr 55px;align-items:center;gap:10px}.track{height:9px;background:#26334b;border-radius:20px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#3985ed,#52c6b3);border-radius:20px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}input{background:#0d1526;color:var(--text);border:1px solid var(--line);padding:10px 12px;border-radius:9px;min-width:180px;flex:1}
.group{border:1px solid var(--line);border-radius:10px;margin:8px 0;overflow:hidden}.group summary{padding:10px 12px;background:#172239;cursor:pointer;font-weight:650}.channel{display:grid;grid-template-columns:minmax(160px,1fr) 100px 90px 105px;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid #202c42}.channel.empty{opacity:.43}.dots{display:flex;gap:4px}.dot{width:9px;height:9px;border-radius:50%;background:#58657a}.dot.online{background:var(--green)}.dot.offline{background:var(--red)}.dot.pending{background:var(--yellow)}.right{text-align:right;color:#bdc9dc;font-variant-numeric:tabular-nums}.source{display:grid;grid-template-columns:minmax(160px,1fr) 75px 75px 75px 75px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.source:first-of-type{border-top:0}.source button{padding:5px 9px;color:#ffb0b5;border-color:#74404a;background:#301d2a}.emptytext{padding:20px;text-align:center;color:var(--muted)}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0c1424ed;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:12px 20px;display:flex;justify-content:center;gap:9px;align-items:center;flex-wrap:wrap}.bottom span{color:var(--muted);margin-right:8px}
@media(max-width:760px){body{padding:14px 12px 110px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.channel{grid-template-columns:minmax(130px,1fr) 78px 55px}.channel .detail{display:none}.source{grid-template-columns:minmax(130px,1fr) 55px 55px 55px}.source .size{display:none}.brand{width:100%;margin:0}.barrow{grid-template-columns:70px 1fr 45px}}
</style></head><body><main>
<header class="top"><div class="brand">📡 IPTV Discovery <span class="muted">/ 运维面板</span></div><span class="pill" id="status">正在连接…</span><div class="actions"><button onclick="addSource()">＋ 添加源</button><button class="primary" onclick="runCheck()">▶ 开始检测</button><button onclick="setToken()">密钥设置</button></div></header>
<div id="notice" class="notice">尚未检测：导入直播源后，点击“开始检测”。检测完成后这里会显示在线率和未匹配频道。</div>
<section class="grid">
<div class="card"><div class="muted">源条目</div><div class="metric" id="candidates">—</div></div>
<div class="card"><div class="muted">覆盖频道</div><div class="metric" id="covered">—</div></div>
<div class="card"><div class="muted">在线源</div><div class="metric" id="online">—</div></div>
<div class="card"><div class="muted">平均延迟</div><div class="metric" id="latency">—</div></div>
</section>
<div class="two"><section class="section"><h2>源整理概况</h2><div class="tagcloud" id="tags"></div><div class="bars" id="bars" style="margin-top:16px"></div><p class="muted" id="topchannel"></p></section>
<section class="section"><h2>源文件 / 订阅</h2><div id="sources"><div class="emptytext">暂无源</div></div></section></div>
<section class="section"><h2>频道健康度</h2><div class="toolbar"><input id="search" placeholder="搜索频道名称…" oninput="renderChannels()"><span class="muted" id="channelcount"></span></div><div id="channels"><div class="emptytext">正在加载频道…</div></div></section>
</main><footer class="bottom"><span>导出在线源</span><a class="btn" href="/exports/result.m3u">M3U</a><a class="btn" href="/exports/result.txt">TXT</a><a class="btn" href="/exports/result.json">JSON</a><button onclick="copyLink('/exports/result.m3u')">复制 M3U 订阅链接</button></footer>
<script>
let data=null,token=localStorage.getItem('iptv_admin_token')||'';
async function api(path,opts={}){opts.headers={...(opts.headers||{}),...(token?{'X-Admin-Token':token}:{})};const r=await fetch(path,opts);let j;try{j=await r.json()}catch{j=await r.text()}if(!r.ok)throw new Error(j.detail||j.message||r.statusText);return j}
function setToken(){const v=prompt('输入 ADMIN_TOKEN（仅保存在当前浏览器）',token);if(v!==null){token=v.trim();localStorage.setItem('iptv_admin_token',token);refresh()}}
async function addSource(){const url=prompt('输入 M3U/TXT 订阅 URL');if(!url)return;const name=prompt('给这个源起个名称',new URL(url).hostname)||'remote-source';try{const r=await api('/api/imports/remote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,source_name:name})});alert('导入完成：解析 '+r.parsed+' 条，新增 '+r.added+' 条');refresh()}catch(e){alert('导入失败：'+e.message)}}
async function runCheck(){const b=document.querySelector('.primary');b.disabled=true;b.textContent='检测中…';try{const r=await api('/api/checks/run',{method:'POST'});alert('检测完成：'+r.checked+' 条，在线 '+r.online+' 条，离线 '+r.offline+' 条');await refresh()}catch(e){alert('检测失败：'+e.message)}finally{b.disabled=false;b.textContent='▶ 开始检测'}}
async function copyLink(path){const u=location.origin+path;try{await navigator.clipboard.writeText(u);alert('已复制：'+u)}catch{prompt('复制订阅链接',u)}}
async function delSource(id,name){if(!confirm('删除源「'+name+'」及其关联的候选地址和检测记录？'))return;try{await api('/api/sources/'+id,{method:'DELETE'});refresh()}catch(e){alert('删除失败：'+e.message)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderChannels(){if(!data)return;const q=document.getElementById('search').value.trim().toLowerCase();const rows=data.channels.filter(x=>(x.name+' '+x.group_name).toLowerCase().includes(q));document.getElementById('channelcount').textContent=rows.length+' / '+data.channels.length+' 个频道';const groups={};rows.forEach(x=>(groups[x.group_name||'其他']??=[]).push(x));document.getElementById('channels').innerHTML=Object.entries(groups).map(([g,list])=>'<details class="group" open><summary>'+esc(g)+' · '+list.length+'</summary>'+list.map(x=>{let dots='';for(let i=0;i<Math.min(4,Math.max(1,x.candidate_count));i++){const st=i<x.online_count?'online':i<x.online_count+x.offline_count?'offline':'pending';dots+='<i class="dot '+st+'"></i>'}return '<div class="channel '+(!x.candidate_count?'empty':'')+'"><span>'+esc(x.name)+'</span><span class="dots">'+dots+'</span><span class="right">'+x.candidate_count+' 条</span><span class="right detail">'+(x.best_height?x.best_height+'p':x.best_latency!=null?Math.round(x.best_latency)+' ms':'—')+'</span></div>'}).join('')+'</details>').join('')||'<div class="emptytext">没有匹配的频道</div>'}
function render(){const d=data;document.getElementById('status').textContent='运行正常 · '+d.sources.length+' 个源';document.getElementById('candidates').textContent=d.total_candidates;document.getElementById('covered').textContent=d.covered_channels+' / '+d.total_channels;document.getElementById('online').textContent=d.has_checks?d.online:'—';document.getElementById('latency').textContent=d.avg_latency==null?'—':Math.round(d.avg_latency)+' ms';const notice=document.getElementById('notice');notice.className='notice '+(d.has_checks?'ok':'');notice.textContent=d.has_checks?'最近已完成检测：在线 '+d.online+' 条，离线 '+d.offline+' 条，未匹配 '+d.unmatched+' 条。':'尚未检测：当前在线源显示为 —。导入直播源后，点击“开始检测”。';document.getElementById('tags').innerHTML='<span class="tag">总条目 '+d.total_candidates+'</span><span class="tag">有源频道 '+d.covered_channels+'</span><span class="tag">空频道 '+(d.total_channels-d.covered_channels)+'</span><span class="tag">未匹配 '+d.unmatched+'</span>';document.getElementById('bars').innerHTML=d.groups.map(g=>'<div class="barrow"><span>'+esc(g.name)+'</span><div class="track"><div class="fill" style="width:'+(g.total?100*g.covered/g.total:0)+'%"></div></div><span class="right">'+g.covered+'/'+g.total+'</span></div>').join('');document.getElementById('topchannel').textContent=d.top_channel?'源最多的频道：'+d.top_channel.name+'（'+d.top_channel.count+' 条）':'源最多的频道：—';document.getElementById('sources').innerHTML=d.sources.map(s=>'<div class="source"><div><b>'+esc(s.name)+'</b><div class="muted">'+esc(s.source_type)+' · '+esc(s.source_url||'本地导入')+'</div></div><span class="right">'+s.candidates+' 条</span><span class="right">'+(s.online??'—')+' 在线</span><span class="right size">—</span><button onclick="delSource('+s.id+',\''+esc(s.name).replace(/'/g,"\\'")+'\')">删除</button></div>').join('')||'<div class="emptytext">暂无源，请添加订阅</div>';renderChannels()}
async function refresh(){try{data=await api('/api/overview');render()}catch(e){document.getElementById('status').textContent='连接失败';document.getElementById('notice').textContent='无法读取数据：'+e.message+'。请确认服务已启动，并在密钥设置中填写 ADMIN_TOKEN。'}}
refresh();setInterval(refresh,30000);
</script></body></html>
