services:
  iptv-discovery:
    build: .
    image: iptv-discovery:latest
    container_name: iptv-discovery
    restart: unless-stopped
    ports:
      - "${APP_PORT:-18787}:18787"
    environment:
      DATA_DIR: /data
      CONFIG_DIR: /app/config
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-4}
      DEEP_CONCURRENCY: ${DEEP_CONCURRENCY:-1}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-8}
      MAX_IMPORT_BYTES: ${MAX_IMPORT_BYTES:-5242880}
    volumes:
      - ./data:/data
    mem_limit: 1g
    cpus: 2.0
    healthcheck:
      test: ["CMD","curl","-fsS","http://127.0.0.1:18787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
